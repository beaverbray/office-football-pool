name: Diag - Splash egress

# TEMPORARY. Determines whether Splash's firewall blocks datacenter egress on
# all hosts or only the auth host. Delete once answered.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Splash hosts from a GitHub-hosted runner
        run: |
          echo "runner egress IP: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          echo

          for target in \
            "https://api.auth.splashsports.com/universal-auth/me" \
            "https://api.splashsports.com/contests-service-v2/api/contests/slates?contestId=x" \
            "https://contests.app.splashsports.com/" \
            "https://gamma-api.polymarket.com/markets?limit=1"
          do
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 15 "$target" || echo 000)
            err=$(grep -o '"error":"[A-Z_]*"' /tmp/body 2>/dev/null | head -1)
            printf '%-72s %s %s\n' "${target:0:72}" "$code" "$err"
          done
