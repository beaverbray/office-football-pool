name: Fetch Picksheet

on:
  # Thursday 6PM PT = Friday 2AM UTC (before Thursday Night Football).
  #
  # Safe to leave enabled even before the secrets exist: the first step below
  # checks them and exits cleanly with a notice if any are missing, so an
  # unconfigured repo produces a green "skipped" run rather than a weekly
  # failure. The day the secrets are set, the cron starts working with no
  # code change. Tracked in #29.
  schedule:
    - cron: '0 2 * * 5'
  workflow_dispatch:
    inputs:
      slate:
        description: 'Slate abbreviation, e.g. week_3 (default: the current slate)'
        required: false
        type: string
      dry_run:
        description: 'Fetch and report without writing to the database'
        required: false
        type: boolean
        default: false

concurrency:
  group: fetch-picksheet
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Runs before checkout/install so an unconfigured repo costs nothing.
      # `secrets.*` cannot be used in a job-level `if:`, hence a step.
      - name: Check configuration
        id: preflight
        env:
          PICKSHEET_SESSION_B64: ${{ secrets.PICKSHEET_SESSION_B64 }}
          SPLASH_CONTEST_ID: ${{ secrets.SPLASH_CONTEST_ID }}
          SPLASH_ENTRY_ID: ${{ secrets.SPLASH_ENTRY_ID }}
        run: |
          missing=""
          [ -z "$PICKSHEET_SESSION_B64" ] && missing="$missing PICKSHEET_SESSION_B64"
          [ -z "$SPLASH_CONTEST_ID" ] && missing="$missing SPLASH_CONTEST_ID"
          [ -z "$SPLASH_ENTRY_ID" ] && missing="$missing SPLASH_ENTRY_ID"
          if [ -n "$missing" ]; then
            echo "::notice::Picksheet fetch not configured — missing secrets:$missing. Set it with: npm -s --prefix app run session:b64 -- --quiet | gh secret set PICKSHEET_SESSION_B64 (no browser needed if a session already exists; otherwise run 'npm run login' first). Skipping."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        if: steps.preflight.outputs.configured == 'true'
        working-directory: app
        run: npm ci

      # Auth note: this job does NOT log in. The Splash sign-in is
      # reCAPTCHA-protected, so an automated login cannot complete it. A human
      # runs `npm run login` locally and stores the output of
      # `npm run login -- --print-b64` as PICKSHEET_SESSION_B64.
      #
      # A workflow cannot write back to its own secret, so the stored token pair
      # stays at its login-time value. Refresh needs both tokens; an 8-day-stale
      # access token was observed to still refresh, but the outer bound is
      # unknown. If the job reports "Authentication required", re-run login and
      # update the secret. Expect roughly monthly.
      - name: Fetch picksheet
        if: steps.preflight.outputs.configured == 'true'
        working-directory: app
        env:
          PICKSHEET_SESSION_B64: ${{ secrets.PICKSHEET_SESSION_B64 }}
          SPLASH_CONTEST_ID: ${{ secrets.SPLASH_CONTEST_ID }}
          SPLASH_ENTRY_ID: ${{ secrets.SPLASH_ENTRY_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          # Dispatch inputs go through env, never interpolated into the shell:
          # `${{ inputs.x }}` inline is a script-injection vector.
          SLATE: ${{ inputs.slate }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=""
          if [ -n "$SLATE" ]; then
            ARGS="$ARGS --slate=$SLATE"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          npx tsx scripts/fetch-picksheet-api.ts $ARGS
