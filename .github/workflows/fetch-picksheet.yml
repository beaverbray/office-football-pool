name: Fetch Picksheet

on:
  # Thursday 6PM PT = Friday 2AM UTC (before Thursday Night Football).
  #
  # Re-enabled now that the job uses the Splash API rather than scraping
  # officefootballpool.com. The OFP path could not authenticate (OFP and
  # app.splashsports.com keep separate sessions), which is why this was
  # previously disabled.
  schedule:
    - cron: '0 2 * * 5'
  workflow_dispatch:
    inputs:
      slate:
        description: 'Slate abbreviation, e.g. week_3 (default: the current slate)'
        required: false
        type: string
      dry_run:
        description: 'Fetch and report without writing to the database'
        required: false
        type: boolean
        default: false

concurrency:
  group: fetch-picksheet
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      # Auth note: this job does NOT log in. The Splash sign-in is
      # reCAPTCHA-protected, so an automated login cannot complete it. A human
      # runs `npm run login` locally and stores the output of
      # `npm run login -- --print-b64` as PICKSHEET_SESSION_B64.
      #
      # A workflow cannot write back to its own secret, so the stored token pair
      # stays at its login-time value. Refresh needs both tokens; an 8-day-stale
      # access token was observed to still refresh, but the outer bound is
      # unknown. If the job reports "Authentication required", re-run login and
      # update the secret. Expect roughly monthly.
      - name: Fetch picksheet
        working-directory: app
        env:
          PICKSHEET_SESSION_B64: ${{ secrets.PICKSHEET_SESSION_B64 }}
          SPLASH_CONTEST_ID: ${{ secrets.SPLASH_CONTEST_ID }}
          SPLASH_ENTRY_ID: ${{ secrets.SPLASH_ENTRY_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.slate }}" ]; then
            ARGS="$ARGS --slate=${{ inputs.slate }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          npx tsx scripts/fetch-picksheet-api.ts $ARGS
