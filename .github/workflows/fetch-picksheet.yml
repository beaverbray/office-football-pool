name: Fetch Picksheet

on:
  schedule:
    # Thursday 6PM PT = Friday 2AM UTC (before Thursday Night Football)
    - cron: '0 2 * * 5'
  workflow_dispatch:
    inputs:
      week:
        description: 'Override NFL week number (optional)'
        required: false
        type: number

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Fetch picksheet
        working-directory: app
        env:
          OFFICE_POOL_EMAIL: ${{ secrets.OFFICE_POOL_EMAIL }}
          OFFICE_POOL_PASSWORD: ${{ secrets.OFFICE_POOL_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -n "${{ inputs.week }}" ]; then
            npx tsx scripts/fetch-picksheet.ts --week=${{ inputs.week }}
          else
            npx tsx scripts/fetch-picksheet.ts
          fi
